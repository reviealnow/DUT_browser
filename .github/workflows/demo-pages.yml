# Publish the demo kit so the README's screenshots have something to click.
#
# Pages' branch mode can only serve `/` or `/docs`, and these pages live in
# `dut-dashboard/demo/`. Copying them to `/docs` or to a `gh-pages` branch would
# make a second copy that drifts, which is the one thing this kit is built to
# avoid — so this deploys from the real directory instead.
#
# Only the pages are published. `build_demo_data.py`, `demo-fixtures.json` and
# `verify/` stay in the repository where they belong: a visitor is here to see
# the screens, and a static host has no use for the generator that made them.
#
# The same site also carries the real React app, built in Demo Mode, under
# `app/`: the kit stays the front door at the root, and `app/` is the product
# itself running on replayed synthetic telemetry (see the "Demo Mode" section
# of dut-dashboard/README.md). They are deployed by this one workflow
# because a repository has one Pages site and every deployment replaces all of
# it -- a second workflow uploading only `app/` would delete the kit, and the
# kit's next deployment would delete `app/`.
name: Deploy demo kit and Demo Mode app to Pages

on:
  push:
    branches: [CPU_Plots]
    paths:
      - "dut-dashboard/demo/*.html"
      - "dut-dashboard/frontend/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done: a cancelled deploy
# can leave the site serving a mix of two revisions.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stage the pages, and nothing else
        run: |
          mkdir -p _site
          cp dut-dashboard/demo/*.html _site/
          echo "Publishing $(ls _site | wc -l) pages:"
          ls -lh _site

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dut-dashboard/frontend/package-lock.json

      # `--mode demo` loads .env.demo (VITE_APP_MODE=demo) and sets the base to
      # /DUT_browser/app/, so every asset URL in the build already points where
      # it is about to be served from. No backend is reachable from Pages, and
      # a demo build never asks for one.
      - name: Build the app in Demo Mode into app/
        working-directory: dut-dashboard/frontend
        run: |
          npm ci
          npm run build:demo
          cp -r dist ../../_site/app
          echo "app/ holds $(find ../../_site/app -type f | wc -l) files"

      # No `enablement:` — `configure-pages` says that option "requires a token
      # other than GITHUB_TOKEN", so with the default token it cannot turn Pages
      # on and the first run would fail rather than bootstrap the site. Pages is
      # enabled once by hand, with Source: GitHub Actions; handing this workflow
      # a PAT purely to flip a repository setting would buy a credential with
      # administration scope to save a single click.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
